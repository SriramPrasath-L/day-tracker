name: deploy-backend
on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch: {}
permissions:
  id-token: write   # lets GitHub prove its identity to AWS, so no AWS keys are stored in the repo
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: cd backend/src && npm install
      - run: cd backend && sam build && sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
